name: 'AI Code Review'
description: 'Reviews pull requests with AI: diff → pluggable LLM adapter → actionable comments'
author: 'FrancosCorporation'
inputs:
  github_token:
    description: 'GITHUB_TOKEN do job chamador (nunca use um PAT pessoal)'
    required: true
  llm_base_url:
    description: 'OpenAI-compatible base URL'
    required: false
    default: ''
  llm_api_key:
    description: 'LLM API key (use GitHub secrets!)'
    required: false
    default: ''
  llm_model:
    description: 'Model name'
    required: false
    default: 'llama-3.1-70b-instruct'
  idioma:
    description: 'Review language (pt/en)'
    required: false
    default: 'pt'
  severidade:
    description: 'Minimum severity to comment (info/warn/critico)'
    required: false
    default: 'warn'
  ignorados:
    description: 'Comma-separated path substrings or * globs to skip'
    required: false
    default: ''
  max_blocos:
    description: 'Maximum number of diff chunks sent to the LLM (1-50)'
    required: false
    default: '20'
  max_diff_bytes:
    description: 'Maximum diff bytes to read (1024-1048576)'
    required: false
    default: '102400'
runs:
  using: 'node24'
  main: 'src/cr.js'
branding:
  icon: 'eye'
  color: 'purple'
